<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee Pizza</title>
   <link rel="stylesheet" href="style7.css">
    <script>
        function placeOrder() {
            const choice = document.getElementById("choice").value;
            alert("You have ordered: " + choice);
            localStorage.setItem("lastOrder", choice);
            window.location.href = "order.html";
        }
    </script>
</head>
<body>
    <h1>Order Your Pizza</h1>
    <div class="pizza-choice">
    <label for="choice"></label>
    <select id="choice" name="choice">
        <option value="supreme">Supreme Pizza</option>
        <option value="margherita">Margherita Pizza</option>
        <option value="veggie">Veggie Pizza</option>
        <option value="chicken">Chicken Pizza</option>
        <option value="pepperoni">Pepperoni Pizza</option>
    </select>
    </div>
    <div style="text-align: center; margin-top: 20px;">
    <button class="order" onclick="placeOrder()">Order Now</button>
    </div>

</body>
</html>
