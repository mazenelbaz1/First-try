<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <style>
        h1 {
            justify-content: center;
            text-align: center;
            margin-top: 270px;
            font-size: 50px;
            color: white;
            display: inline-block;
            background-color: rgb(160, 35, 35);
            border-radius: 20px;
            size: 50px;
            padding: 20px 40px;
            text-align: center;
        }

        body {
            background-color: rgb(243, 192, 38);
            text-align: center;
          
        }
        .pizza-name {
            text-align: center;
            color: white;
            font-size: 20px;
            border-radius: 20px;
            background-color: rgb(160, 35, 35);
            border: 2px solid rgb(160, 35, 35);
        }
        </style>
</head>
<body>
    <h1>THANK YOU FOR YOUR ORDER!</h1>
    <p class="pizza-name" id="pizza-name"></p>
    <script>
        const pizza = localStorage.getItem("lastOrder");
        document.getElementById('pizza-name').textContent = "You Selected: " + pizza + " pizza";
    </script>
</body>
</html>
